<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada — Arte en Lomillo</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#7a2145" />

  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Playfair+Display:ital@1&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    .error-404 {
      min-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-xl) var(--space-md);
    }
    .error-404__contenido { max-width: 480px; }
    .error-404__codigo {
      font-family: var(--font-script);
      font-style: italic;
      font-size: var(--text-3xl);
      color: var(--color-dorado);
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="contenedor navbar__contenedor">
      <a class="navbar__marca" href="index.html">Arte en <span class="acento-script">Lomillo</span></a>
    </div>
  </header>

  <main class="error-404">
    <div class="error-404__contenido">
      <p class="error-404__codigo">404</p>
      <h1>Este hilo se perdió en el camino</h1>
      <p>La página que buscas no existe o fue movida. Vuelve al catálogo y encuentra tu pieza bordada a mano.</p>
      <p style="margin-top: 2rem;">
        <a class="boton boton--primario" href="index.html">Volver al inicio</a>
      </p>
    </div>
  </main>

  <footer class="pie">
    <div class="contenedor">
      <p class="pie__marca">Arte en Lomillo</p>
      <p class="pie__aviso">© 2026 Arte en Lomillo™. Todos los derechos reservados.</p>
    </div>
  </footer>
</body>
</html>
